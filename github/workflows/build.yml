name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get love-android
        run: git clone --recurse-submodules https://github.com/love2d/love-android.git la
      - name: Add the game
        run: |
          mkdir -p la/app/src/embed/assets
          cp price-manager.love la/app/src/embed/assets/game.love
          sed -i 's/^app.name.*/app.name=Price Manager/' la/gradle.properties
          sed -i 's/^app.application_id.*/app.application_id=com.jeffrey.pricemanager/' la/gradle.properties
      - name: Build
        working-directory: la
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          chmod +x gradlew
          ./gradlew assembleEmbedNoRecordDebug
      - uses: actions/upload-artifact@v4
        with:
          name: price-manager-apk
          path: la/app/build/outputs/apk/embedNoRecord/debug/*.apk
